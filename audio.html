:root {

 --open-title-top:88px;
 --open-question-top:clamp(570px,calc(508px + 20vw),612px);
 --open-title-size:44px;
 --open-question-size:24px;
 --open-copy-gap:6px;
 --open-support:300 14px/20px Inter, Arial, sans-serif;
 --open-action:400 14px/18px Inter, Arial, sans-serif;
 --open-serif:"Cormorant Garamond", Georgia, serif;
}
/* The stacked grid needs room for the last row's hover captions. */
[data-grid-layout] { --open-title-top:105px; --open-question-top:620px; }
@media(max-width:479px) {
 :root { --open-title-size:clamp(26px,9.25vw,36px); --open-question-size:22px; }
}

:root {
 --ink:#181b1e;
 --quiet:#66696e;
 --question:#45484c;
 --faint:#84868a;

}
html,body { height:100%; margin:0; background:transparent; }
.sound-experience :is(#collection,#mute),#experience :is(#return,#motion) { display:none; }

/* Scale each orbit around its own circle, including the matching hit areas. */
:is(#sound-items,#sound-shadows,#renders,#shadows,#targets) {
 position:absolute; inset:0;
 transform-origin:50% var(--hub-y,360px);
 scale:.14; opacity:0;
 transition:scale .5s cubic-bezier(.5,0,.72,.65),opacity .38s ease .1s;
}
[data-collection-open="true"] :is(#sound-items,#sound-shadows,#renders,#shadows,#targets) {
 scale:none; opacity:1;
 transition:scale .68s cubic-bezier(.22,.72,.26,1),opacity .42s ease;
}
#sound-items { z-index:2; pointer-events:none; }
#sound-items > :is(.sound-item,.vacant-sound) { pointer-events:auto; }
#renders { z-index:4; }
#targets { z-index:5; }
[data-collection-open="false"] :is(.sound-selected-title,.question-band,#material-caption,#grass-tools,#texture-action) { visibility:hidden; }
[data-collection-open="false"] :is(.sound-label,.texture-label) { visibility:hidden; }
@media(prefers-reduced-motion:reduce) {
 :is(#sound-items,#sound-shadows,#renders,#shadows,#targets) { transition:none !important; }
}

/* Audio */
.sound-experience { height:725px; min-height:0; grid-template-rows:var(--open-question-top) minmax(0,1fr); color:var(--ink); font-family:var(--sans); }
.central-disc,#hub { border:1.5px solid var(--ink); }
.audio-gate {
 position:absolute; z-index:3; top:var(--hub-y,360px); left:50%; transform:translate(-50%,-50%);
 width:var(--hub-size,200px); height:var(--hub-size,200px); border:0; border-radius:50%; background:transparent;
 cursor:pointer;
}
.audio-gate:focus-visible { outline:2px solid #d4ba8a; outline-offset:4px; }
[data-collection-open="false"] .sound-control,
.sound-experience[data-state="selected"] .audio-gate { display:none; }
.resting-copy { inset:12px; gap:6px; }
.resting-copy h1,#hub-copy>span,#discovery-copy>span {
 font:400 26px/var(--circle-title-leading) var(--serif);
 text-wrap:balance;
 translate:0 1px;
}
.resting-copy p,#hub-copy small,#discovery-copy small {
 color:var(--quiet);
 font:300 14px/20px var(--sans);
 padding-top:5px;
}
.sound-image { border-color:var(--outline); }
.sound-label,.texture-label {
 position:absolute;
 left:50%;
 top:calc(100% + 10.5px);
 width:max-content;
 max-width:138px;
 color:var(--quiet);
 font:400 14px/18px var(--sans);
 letter-spacing:.02em;
 text-align:center;
 text-wrap:balance;
 pointer-events:none;
 opacity:0;
 transform:translate(-50%,-2px);
 transition:opacity .4s ease,transform .5s ease;
}
:is(.sound-item,.material-target):disabled > :is(.sound-label,.texture-label) { visibility:hidden; }

 transform:translate(-50%);
}
@media(prefers-reduced-motion:reduce) {
 .sound-label,.texture-label { transition:none; }
}
.sound-item:disabled { cursor:default; }
.sound-control { top:24px; font:400 14px/20px var(--sans); }
.sound-selected-title {
 position:absolute; inset-inline:12px; margin:0; text-align:center; pointer-events:none;
}
.sound-selected-title,#material-caption h1 {

.question-band { min-height:0; gap:var(--open-copy-gap); padding:0 12px; }
.sound-caption { margin:0; color:var(--faint); font:var(--open-support); }
.sound-experience .replay-control {

.sound-experience .replay-control:hover { color:var(--ink); }
.sound-question { --sound-question-size:var(--open-question-size); }

.playback-status { position:static; margin:2px 0 0; font:300 13px/17px var(--sans); }

 :root:not([data-grid-layout]) :is(.resting-copy p,#hub-copy small,#discovery-copy small) { font-size:clamp(12px,3.25vw,14px); line-height:1.3; padding-top:2px; }
 .sound-shadow:not([data-selected="true"]),
 #experience .render-shadow[data-orbit] { margin-left:-5px; margin-top:-12px; }
 .sound-question,#material-question { line-height:1.2; }
}
@media(max-width:395px) {

 #experience:has(#grass-tools:not([hidden]),#texture-action:not([hidden])) #material-question { line-height:1.12; }
